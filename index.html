<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Employee Portal</title>
    <!-- Include Supabase and PDF-lib libraries automatically -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 650px; margin-top: 20px; box-sizing: border-box; }
        h2 { color: #2c3e50; margin-bottom: 5px; font-size: 24px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group.full { width: 100%; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 140px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="date"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: border-color 0.2s; }
        input:focus { border-color: #3498db; outline: none; }
        button { background-color: #2ecc71; color: white; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background-color 0.2s; margin-top: 10px; }
        button:hover { background-color: #27ae60; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .hidden { display: none; }
        .message { padding: 15px; background-color: #d4edda; color: #155724; border-radius: 6px; margin-bottom: 20px; text-align: center; border: 1px solid #c3e6cb; font-size: 14px; line-height: 1.5; }
        .section-title { font-size: 16px; font-weight: bold; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 6px; margin: 25px 0 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- SCREEN 1: LOGIN BOX -->
    <div id="login-screen">
        <h2>Employee Login</h2>
        <p>Enter your corporate email address to receive a secure sign-in verification link.</p>
        <div id="login-msg" class="message hidden"></div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="employee-email" placeholder="name@company.com">
        </div>
        <button id="login-btn" onclick="sendMagicLink()">Send Login Link</button>
    </div>

    <!-- SCREEN 2: THE COMPREHENSIVE FORM (Hidden until logged in) -->
    <div id="form-screen" class="hidden">
        <h2>Information Portal Form</h2>
        <p>Please enter your information accurately. Your data is strictly locked and confidential.</p>
        <div id="status-msg" class="message hidden"></div>
        
        <form id="pdf-form" onsubmit="submitForm(event)">
            
            <div class="section-title">Personal Identification</div>
            <div class="form-group">
                <label>Employee Name</label>
                <input type="text" id="field-Name" required placeholder="Johnathan Doe">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="field-Adress" required placeholder="123 Main Street">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="field-City" required placeholder="New York">
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="field-State" required placeholder="NY">
                </div>
                <div class="form-group">
                    <label>Zip Code</label>
                    <input type="text" id="field-Zip" required placeholder="10001">
                </div>
            </div>

            <div class="form-group">
                <label>Social Security Number (SSN)</label>
                <input type="text" id="field-SSN" required placeholder="000-00-0000" oninput="formatSSN(this)">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Country of Residence</label>
                    <input type="text" id="field-Country_of_Residence" required placeholder="United States">
                </div>
                <div class="form-group">
                    <label>Country of Employment</label>
                    <input type="text" id="field-Country_of_Employment" required placeholder="United States">
                </div>
            </div>

            <div class="section-title">Additional Questions</div>
            <div class="form-row">
                <div class="form-group"><label>Field 1</label><input type="text" id="field-1"></div>
                <div class="form-group"><label>Field 2</label><input type="text" id="field-2"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Field 3</label><input type="text" id="field-3"></div>
                <div class="form-group"><label>Field 4</label><input type="text" id="field-4"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Field 5</label><input type="text" id="field-5"></div>
                <div class="form-group"><label>Field 6</label><input type="text" id="field-6"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Field 7</label><input type="text" id="field-7"></div>
                <div class="form-group"><label>Field 8</label><input type="text" id="field-8"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Field 9</label><input type="text" id="field-9"></div>
                <div class="form-group"><label>Field 10</label><input type="text" id="field-10"></div>
            </div>

            <div class="section-title">Verification & Execution</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date of Signing</label>
                    <input type="date" id="field-Date" required>
                </div>
                <div class="form-group">
                    <label>Upload Signature Image</label>
                    <input type="file" id="field-Signature" accept="image/*" required>
                </div>
            </div>

            <button type="submit" id="submit-btn">Submit Securely</button>
        </form>
    </div>
</div>

<script>
    // System Configurations
    const SUPABASE_URL       = 'https://dcbhmqxcpclrsabdqond.supabase.co'; 
    const SUPABASE_ANON_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjYmhtcXhjcGNscnNhYmRxb25kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1ODc2ODEsImV4cCI6MjEwOTE2MzY4MX0.hxttL0vHclPgD8SwRN2zdMImKiBMnHXcwULROeRJqg8';
    const BLANK_PDF_URL       = './template.pdf';   
    const BUCKET_NAME         = 'pdfs';             

    // Initialize Supabase Connection
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto-detect authentication from Magic Link redirect
    window.onload = async () => {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (session) {
            showFormScreen();
        }
    };

    // Helper: auto format SSN visually for security and structure
    function formatSSN(input) {
        let val = input.value.replace(/\D/g, '');
        let newVal = '';
        if (val.length > 4) {
            this.value = val;
        }
        if (val.length > 3 && val.length < 6) {
            newVal += val.substr(0, 3) + '-';
            val = val.substr(3);
        } else if (val.length > 5) {
            newVal += val.substr(0, 3) + '-';
            newVal += val.substr(3, 2) + '-';
            val = val.substr(5);
        }
        newVal += val;
        input.value = newVal.substr(0, 11);
    }

    // Auth Action: Request link delivery
    async function sendMagicLink() {
        const email = document.getElementById('employee-email').value.trim();
        const loginBtn = document.getElementById('login-btn');
        if (!email) { alert('Please enter your email address.'); return; }

        loginBtn.disabled = true;
        loginBtn.textContent = "Sending Link...";

        const { error } = await supabase.auth.signInWithOtp({ 
            email: email,
            options: { redirectTo: window.location.href } 
        });

        if (error) {
            alert('Authentication Error: ' + error.message);
            loginBtn.disabled = false;
            loginBtn.textContent = "Send Login Link";
        } else {
            const msgBox = document.getElementById('login-msg');
            msgBox.innerHTML = "<strong>Success!</strong> Secure sign-in link has been sent.<br>Check your email inbox and click it to unlock the form fields.";
            msgBox.classList.remove('hidden');
            loginBtn.textContent = "Link Dispatched";
        }
    }

    function showFormScreen() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('form-screen').classList.remove('hidden');
        // Auto fill today's date into the execution view
        document.getElementById('field-Date').valueAsDate = new Date();
    }

    // Processing & Compiling Actions
    async function submitForm(event) {
event.preventDefault();
const submitBtn = document.getElementById('submit-btn');
submitBtn.disabled = true;
submitBtn.textContent = "Encrypting & Injecting Data...";
try {
const { data: { user } } = await supabase.auth.getUser();
if (!user) throw new Error("User session expired. Please re-authenticate.");
// 1. Fetch the physical form template
const pdfBytes = await fetch(BLANK_PDF_URL).then(res => {
if(!res.ok) throw new Error("Could not load template.pdf file from hosting repository.");
return res.arrayBuffer();
});
const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
const form = pdfDoc.getForm();
// 2. Map & Inject Form Elements
const fieldsToFill = {
'Name': document.getElementById('field-Name').value,
'Adress': document.getElementById('field-Adress').value,
'City': document.getElementById('field-City').value,
'State': document.getElementById('field-State').value,
'Zip': document.getElementById('field-Zip').value,
'SSN': document.getElementById('field-SSN').value,
'Country of Residence': document.getElementById('field-Country_of_Residence').value,
'Country of Employment': document.getElementById('field-Country_of_Employment').value,
'Date': document.getElementById('field-Date').value,
'1': document.getElementById('field-1').value,
'2': document.getElementById('field-2').value,
'3': document.getElementById('field-3').value,
'4': document.getElementById('field-4').value,
'5': document.getElementById('field-5').value,
'6': document.getElementById('field-6').value,
'7': document.getElementById('field-7').value,
'8': document.getElementById('field-8').value,
'9': document.getElementById('field-9').value,
'10': document.getElementById('field-10').value
};
// Programmatically assign strings into specific form boxes
for (const [key, val] of Object.entries(fieldsToFill)) {
try {
const textField = form.getTextField(key);
textField.setText(val || '');
} catch(e) {
console.warn(Field ID '${key}' not targeted or missing configuration in Foxit structural layers.);
}
}
// 3. Process image buffer layer conversion for signatures
const sigFileInput = document.getElementById('field-Signature');
if (sigFileInput.files.length > 0) {
const sigFile = sigFileInput.files[0];
const sigBytes = await sigFile.arrayBuffer();
let sigImage;
if (sigFile.type === 'image/png') {
sigImage = await pdfDoc.embedPng(sigBytes);
} else {
sigImage = await pdfDoc.embedJpg(sigBytes);
}
try {
const sigFieldButton = form.getButton('Signature');
sigFieldButton.setImage(sigImage);
} catch(e) {
// Fallback to signature field processing structure if not explicitly defined as button asset
console.error("Signature target asset requires a form layout image button structural configuration inside Foxit.", e);
throw new Error("Could not find an interactive signature button box labeled 'Signature' in your PDF layer.");
}
}
// Lock document down permanently
form.flatten();
const finalPdfBytes = await pdfDoc.save();
const pdfBlob = new Blob([finalPdfBytes], { type: 'application/pdf' });
// 4. Transport payload streams directly into private encrypted cloud partition
const timestamp = Date.now();
const cleanEmail = user.email.replace(/[^a-zA-Z0-9]/g, "_");
const fileName = submission_${cleanEmail}_${timestamp}.pdf;
const { data, error: uploadError } = await supabase.storage
.from(BUCKET_NAME)
.upload(fileName, pdfBlob, { contentType: 'application/pdf', cacheControl: '3600', upsert: false });
if (uploadError) throw uploadError;
// 5. Commit record entries for system logging indexing tracking
const { error: dbError } = await supabase
.from('form_submissions')
.insert([
{ employee_email: user.email, pdf_url: fileName, status: 'completed' }
]);
if (dbError) throw dbError;
// Final View update
document.getElementById('pdf-form').classList.add('hidden');
const statusMsg = document.getElementById('status-msg');
statusMsg.innerHTML = "Submission Complete!
Your information and signature fields have been compiled and secured inside our isolated encryption storage safely.";
statusMsg.classList.remove('hidden');
} catch (err) {
alert("Submission halted: " + err.message);
submitBtn.disabled = false;
submitBtn.textContent = "Submit Securely";
}
}
